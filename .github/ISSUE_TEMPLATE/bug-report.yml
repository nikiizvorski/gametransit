name: Bug report
description: Something in GameTransit itself doesn't work (installing, settings, library, controllers in the app).
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For a game that doesn't run, use **Game compatibility request** instead.
  - type: textarea
    id: what
    attributes:
      label: What went wrong
      description: What you expected, and what happened instead. Include any message GameTransit showed.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Settings
        2. Click …
        3. …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Installing or opening GameTransit
        - Game engine setup (Rosetta, Wine, WineForge, D3DMetal)
        - Steam
        - Epic Games Store
        - Library, artwork or game details
        - Controller or keyboard navigation in the app
        - Settings
        - Something else
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac and macOS
      description: Apple menu → About This Mac.
      placeholder: "MacBook Air M2, 16 GB, macOS 27.0"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: GameTransit version
      description: Settings → Credits, or the release you downloaded.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: Optional, but they help a lot.
